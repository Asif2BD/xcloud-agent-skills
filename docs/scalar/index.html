<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xCloud Agent Skills — API Reference</title>
    <meta
      name="description"
      content="Interactive API reference for the xCloud agent skills — servers, sites, WordPress, SSL, and account, grouped by skill." />
    <link rel="icon" href="https://app.xcloud.host/img/x_cloud.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Scalar API Reference (loaded from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        // Generated from skills-catalog.json by build.mjs — do not edit by hand.
        url: './xcloud-skills.openapi.json',
        theme: 'kepler',
        layout: 'modern',
        darkMode: true,
        hideDarkModeToggle: false,
        showSidebar: true,
        defaultOpenAllTags: false,
        operationTitleSource: 'summary',
        orderRequiredPropertiesFirst: true,
        hideClientButton: true,
        hiddenClients: true,
        persistAuth: false,
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        metaData: {
          title: 'xCloud Agent Skills — API Reference',
          description: 'API surface behind the xCloud agent skills.',
        },
      });
    </script>
  </body>
</html>
